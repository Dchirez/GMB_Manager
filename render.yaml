services:
  - type: web
    name: gmb-manager-backend
    runtime: python
    # RGPD: données hébergées en région UE (résidence des données).
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # IMPORTANT: must be on the SAME host the frontend calls (gmb-backend.dchirez.fr),
      # otherwise the OAuth `state` session cookie set at /auth/login is not sent to
      # /auth/callback (host-only cookie) and the callback fails with 400 Invalid state.
      - key: GOOGLE_REDIRECT_URI
        value: https://gmb-backend.dchirez.fr/auth/callback
      - key: FRONTEND_URL
        value: https://gmb.dchirez.fr
      - key: ADMIN_EMAILS
        value: dchirez59@gmail.com
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      # Ticketing — envoi des demandes de modification par e-mail (SMTP Gmail).
      # SMTP_PASSWORD est un secret (App Password Gmail) -> à saisir dans le
      # dashboard Render (sync: false), pas en clair dans le repo.
      - key: TICKET_RECIPIENT
        value: dchirez59@gmail.com
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: dchirez59@gmail.com
      - key: SMTP_FROM
        value: dchirez59@gmail.com
      - key: SMTP_PASSWORD
        sync: false
