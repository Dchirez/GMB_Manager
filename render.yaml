services:
  - type: web
    name: gmb-manager-backend
    runtime: python
    # RGPD: données hébergées en région UE (résidence des données).
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # IMPORTANT: must be on the SAME host the frontend calls (gmb-backend.dchirez.fr),
      # otherwise the OAuth `state` session cookie set at /auth/login is not sent to
      # /auth/callback (host-only cookie) and the callback fails with 400 Invalid state.
      - key: GOOGLE_REDIRECT_URI
        value: https://gmb-backend.dchirez.fr/auth/callback
      - key: FRONTEND_URL
        value: https://gmb.dchirez.fr
      - key: ADMIN_EMAILS
        value: dchirez59@gmail.com
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: FLASK_ENV
        value: production
      # Ticketing — envoi des demandes par e-mail.
      # IMPORTANT: Render BLOQUE les ports SMTP sortants (25/465/587) -> on envoie
      # via l'API HTTP Resend (HTTPS/443). Les variables SMTP_* ne servent qu'en
      # local (dev), où SMTP fonctionne.
      - key: TICKET_RECIPIENT
        value: dchirez59@gmail.com
      - key: RESEND_FROM
        value: GMB Manager <onboarding@resend.dev>
      - key: RESEND_API_KEY
        sync: false
